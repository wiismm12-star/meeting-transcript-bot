services:
  telegram-bot-api:
    build:
      context: ./docker/telegram-bot-api
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
    command: ["--local", "--http-port=8081", "--dir=/var/lib/telegram-bot-api"]
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./data/telegram-bot-api:/var/lib/telegram-bot-api
    restart: unless-stopped
