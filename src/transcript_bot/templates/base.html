      .menu-wrap { position:relative; display:inline-block; margin-left:4px; }.menu-toggle { color:#52606c !important; padding:7px; border-radius:7px; }.menu-toggle:hover{background:#f1f4f6}.meeting-menu { position:absolute; z-index:10; top:34px; right:0; width:158px; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 10px 24px #223a4c24; padding:6px; }.meeting-menu button { width:100%; color:#35414c; font-size:14px; font-weight:500; text-align:left; padding:10px 12px; border-radius:6px; }.meeting-menu button:hover { background:#f1f7f8; color:var(--teal-dark); }
