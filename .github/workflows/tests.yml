name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: cp .env.example .env
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest tests.test_line_bot tests.test_web tests.test_whisper_local tests.test_gladia tests.test_database tests.test_deepgram_request tests.test_formatting tests.test_ollama_client tests.test_pyannote_diarization tests.test_speaker_naming_flow tests.test_storage -v
