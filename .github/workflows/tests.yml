name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: cp .env.example .env
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest tests.test_line_bot -v
      - run: python -m unittest tests.test_web -v
      - run: python -m unittest tests.test_whisper_local -v
      - run: python -m unittest tests.test_gladia -v
      - run: python -m unittest tests.test_database -v
      - run: python -m unittest tests.test_deepgram_request -v
      - run: python -m unittest tests.test_formatting -v
      - run: python -m unittest tests.test_ollama_client -v
      - run: python -m unittest tests.test_pyannote_diarization -v
      - run: python -m unittest tests.test_speaker_naming_flow -v
      - run: python -m unittest tests.test_storage -v
